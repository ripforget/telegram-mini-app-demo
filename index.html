<!doctype html>
<html lang="ru" data-theme="dark" data-accent="blue" data-font="system">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d1117" id="meta-theme">
<title>Сургут коганэ</title>

<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232f81f7'/%3E%3Cpath d='M9 11l5 5-5 5M17 21h7' fill='none' stroke='white' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
  /* Шрифты */
  @font-face {
    font-family: "Drafting Mono";
    src: url("fonts/DraftingMono-Regular.woff2") format("woff2");
    font-weight: 400;
    font-style: normal;
    font-display: swap;
  }
  @font-face {
    font-family: "Drafting Mono";
    src: url("fonts/DraftingMono-SemiBold.woff2") format("woff2");
    font-weight: 600;
    font-style: normal;
    font-display: swap;
  }
  @font-face {
    font-family: "GC Vensca Mono Demo";
    src: url("fonts/GCVenscaMonoDemo-Regular.woff2") format("woff2");
    font-weight: 400;
    font-style: normal;
    font-display: swap;
  }
  @font-face {
    font-family: "Anime Ace";
    src: url("fonts/AnimeAce.woff2") format("woff2");
    font-weight: 400;
    font-style: normal;
    font-display: swap;
  }

  :root {
    color-scheme: dark;
    --canvas: #0d1117;
    --canvas-inset: #010409;
    --surface: #161b22;
    --surface-hover: #1c2129;
    --border: #30363d;
    --border-hover: #484f58;
    --fg: #e6edf3;
    --fg-muted: #8b949e;
    --success: #3fb950;
    --shadow: 0 10px 26px rgba(1, 4, 9, .55);
    --accent: #2f81f7;
    --accent-2: #1f6feb;
    --accent-soft: rgba(47, 129, 247, .14);
    --mark-a: #388bfd;
    --mark-b: #1f6feb;
    --font-system: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif;
    --ui-font: var(--font-system);
  }

  html[data-font="mono"] { --ui-font: "Drafting Mono", ui-monospace, monospace; }
  html[data-font="vensca"] { --ui-font: "GC Vensca Mono Demo", ui-monospace, monospace; }
  html[data-font="anime"] { --ui-font: "Anime Ace", var(--font-system); }

  html[data-theme="light"] {
    color-scheme: light;
    --canvas: #ffffff;
    --canvas-inset: #f6f8fa;
    --surface: #f6f8fa;
    --surface-hover: #eef1f4;
    --border: #d0d7de;
    --border-hover: #afb8c1;
    --fg: #1f2328;
    --fg-muted: #59636e;
    --success: #1a7f37;
    --shadow: 0 10px 26px rgba(31, 35, 40, .10);
  }

  html[data-accent="blue"] { --accent:#2f81f7; --accent-2:#1f6feb; --accent-soft:rgba(47,129,247,.14); --mark-a:#388bfd; --mark-b:#1f6feb; }
  html[data-accent="red"]  { --accent:#f85149; --accent-2:#da3633; --accent-soft:rgba(248,81,73,.14);  --mark-a:#ff7b72; --mark-b:#da3633; }
  html[data-accent="mint"] { --accent:#3fd0b0; --accent-2:#2bb39a; --accent-soft:rgba(63,208,176,.14);  --mark-a:#5fe3c7; --mark-b:#17a98d; }
  html[data-accent="purple"]{--accent:#bc8cff; --accent-2:#8957e5; --accent-soft:rgba(188,140,255,.15);--mark-a:#d2a8ff; --mark-b:#8957e5; }
  html[data-accent="white"]{--accent:#f0f6fc; --accent-2:#c9d1d9; --accent-soft:rgba(240,246,252,.12);--mark-a:#f0f6fc; --mark-b:#8b949e; }

  html[data-theme="light"][data-accent="white"]{--accent:#24292f; --accent-2:#57606a; --accent-soft:rgba(36,41,47,.08);--mark-a:#ffffff; --mark-b:#d0d7de;}

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { background: var(--canvas); }
  body { margin: 0; min-height: 100dvh; background: var(--canvas); color: var(--fg); font-family: var(--ui-font); font-size: 14px; line-height: 1.45; overflow-x: hidden; }
  body::before { content: ""; position: fixed; inset: -30% 0 auto; height: 60%; background: radial-gradient(50% 60% at 50% 0%, var(--accent-soft), transparent 70%); pointer-events: none; z-index: 0; }
  .app { position: relative; z-index: 1; display: flex; flex-direction: column; width: 100%; max-width: 480px; min-height: 100dvh; margin: 0 auto; overflow: hidden; padding: calc(14px + env(safe-area-inset-top)) 16px calc(16px + env(safe-area-inset-bottom)); }
  .topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .brand { display: flex; align-items: center; gap: 10px; }
  .mark { display: grid; place-items: center; width: 36px; height: 36px; border-radius: 10px; color: #fff; background: linear-gradient(150deg, var(--mark-a), var(--mark-b)); }
  .brand-text h1 { margin: 0; font-size: 17px; font-weight: 600; }
  .brand-text .sub { margin: 1px 0 0; font-size: 11.5px; color: var(--fg-muted); }
  .pill { display: flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 999px; border: 1px solid var(--border); background: var(--surface); color: var(--fg-muted); font-size: 11.5px; }
  .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--fg-muted); }
  .pill.is-live .dot { background: var(--success); box-shadow: 0 0 0 3px rgba(63,185,80,.22); }
  .content { display: flex; flex-direction: column; flex: 1; gap: 14px; padding-top: 18px; }
  .greet-card { padding: 14px; border: 1px solid var(--border); border-radius: 12px; background: var(--surface); }
  .greet-card .hello { margin: 0; font-size: 15px; font-weight: 600; }
  .greet-card .hint { margin: 2px 0 0; font-size: 12.5px; color: var(--fg-muted); }
  .menu { margin-top: auto; padding-top: 8px; }
  .menu-head { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 8px; }
  .menu-head h2 { margin: 0; font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--fg-muted); }
  .menu-count { font-size: 11px; color: var(--fg-muted); }
  .actions { display: flex; flex-direction: column; gap: 10px; }
  .action { display: flex; align-items: center; gap: 12px; width: 100%; min-height: 60px; padding: 10px 12px; border-radius: 12px; border: 1px solid var(--border); background: var(--surface); color: var(--fg); text-align: left; cursor: pointer; }
  .action:hover { background: var(--surface-hover); }
  .action:active { transform: scale(.985); }
  .action-icon { display: grid; place-items: center; width: 38px; height: 38px; border-radius: 9px; border: 1px solid var(--border); background: var(--canvas-inset); color: var(--accent); }
  .action-text { flex: 1; display: flex; flex-direction: column; gap: 1px; }
  .action-title { font-weight: 600; }
  .action-note { font-size: 12px; color: var(--fg-muted); }
  .chevron { color: var(--fg-muted); }
  .screen { position: absolute; inset: 0; z-index: 6; display: flex; flex-direction: column; padding: inherit; background: var(--canvas); opacity: 0; visibility: hidden; transform: translateY(10px); transition: .22s; }
  .screen.is-open { opacity: 1; visibility: visible; transform: none; }
  .screen-top { display: flex; align-items: center; gap: 10px; }
  .icon-btn { display: grid; place-items: center; width: 34px; height: 34px; border-radius: 9px; border: 1px solid var(--border); background: var(--surface); color: var(--fg); cursor: pointer; }
  .screen-top h2 { margin: 0; font-size: 17px; font-weight: 600; }
  .screen-body { display: flex; flex-direction: column; gap: 14px; flex: 1; padding-top: 18px; overflow-y: auto; }
  .field { display: flex; flex-direction: column; gap: 8px; }
  .label { font-size: 12px; color: var(--fg-muted); }
  .input, .textarea { width: 100%; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--border); background: var(--surface); color: var(--fg); font: inherit; }
  .textarea { min-height: 120px; resize: vertical; }
  .primary { margin-top: auto; padding: 12px; border-radius: 10px; border: 1px solid var(--border); background: var(--accent); color: #fff; font-weight: 600; cursor: pointer; }
  html[data-theme="light"] .primary { color: #fff; }
  html[data-accent="white"] .primary { background: var(--accent); color: var(--canvas); }
  .swatches { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
  .swatch { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 10px 2px; border-radius: 10px; border: 1px solid var(--border); background: var(--surface); color: var(--fg-muted); cursor: pointer; }
  .swatch-dot { width: 28px; height: 28px; border-radius: 50%; }
  .swatch--red .swatch-dot { background: #f85149; }
  .swatch--blue .swatch-dot { background: #2f81f7; }
  .swatch--mint .swatch-dot { background: #3fd0b0; }
  .swatch--purple .swatch-dot { background: #bc8cff; }
  .swatch--white .swatch-dot { background: #f6f8fa; border: 1px solid #8b949e; }
  .swatch[aria-checked="true"] { color: var(--fg); border-color: var(--accent); }
  .font-options { display: flex; flex-direction: column; gap: 10px; }
  .font-option { display: flex; align-items: center; gap: 12px; padding: 12px; border-radius: 12px; border: 1px solid var(--border); background: var(--surface); text-align: left; cursor: pointer; color: var(--fg); }
  .font-option[aria-checked="true"] { border-color: var(--accent); background: var(--accent-soft); }
  .toast { position: fixed; left: 50%; bottom: calc(22px + env(safe-area-inset-bottom)); transform: translate(-50%, 14px); padding: 10px 16px; border-radius: 999px; border: 1px solid var(--border); background: var(--surface); color: var(--fg); opacity: 0; pointer-events: none; transition: .2s; }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }
</style>

<script>
(function(){
  var root = document.documentElement;
  var scheme = window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.colorScheme;
  if(!scheme) scheme = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
  root.dataset.theme = scheme === 'light' ? 'light' : 'dark';
  try {
    var a = localStorage.getItem('sk-accent');
    if(['red','blue','mint','purple','white'].indexOf(a) !== -1) root.dataset.accent = a;
    var f = localStorage.getItem('sk-font');
    if(['mono','vensca','anime'].indexOf(f) !== -1) root.dataset.font = f;
  } catch(e){}
})();
</script>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand">
      <span class="mark"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m5 7 5 5-5 5"/><path d="M13 17h6"/></svg></span>
      <div class="brand-text">
        <h1>Сургут коганэ</h1>
        <p class="sub">мини-приложение</p>
      </div>
    </div>
    <span class="pill" id="env-pill"><span class="dot"></span><span id="env-text">браузер</span></span>
  </header>

  <main class="content">
    <section class="greet-card">
      <p class="hello" id="greeting">Привет!</p>
      <p class="hint">добро пожаловать</p>
    </section>

    <section class="menu">
      <div class="menu-head">
        <h2>Меню</h2>
        <span class="menu-count">3 раздела</span>
      </div>
      <div class="actions">
        <button class="action" data-action="1"><span class="action-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V20h4v-6h6v6h4V9.5"/></svg></span><span class="action-text"><span class="action-title">Кнопка 1</span><span class="action-note">Главный раздел</span></span><svg class="chevron" width="16" height="16" viewBox="0 0 24 24"><path d="m9 6 6 6-6 6" stroke="currentColor" stroke-width="2" fill="none"/></svg></button>
        <button class="action" data-action="write"><span class="action-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg></span><span class="action-text"><span class="action-title">Написать</span><span class="action-note">Сообщение пользователю</span></span><svg class="chevron" width="16" height="16" viewBox="0 0 24 24"><path d="m9 6 6 6-6 6" stroke="currentColor" stroke-width="2" fill="none"/></svg></button>
        <button class="action" data-action="settings"><span class="action-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1.03 1.56V21a2 2 0 1 1-4 0v-.09A1.7 1.7 0 0 0 9 19.35a1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.7 1.7 0 0 0 4.65 15a1.7 1.7 0 0 0-1.56-1.03H3a2 2 0 1 1 0-4h.09A1.7 1.7 0 0 0 4.65 9a1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.7 1.7 0 0 0 9 4.65a1.7 1.7 0 0 0 1.03-1.56V3a2 2 0 1 1 4 0v.09A1.7 1.7 0 0 0 15 4.65a1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.7 1.7 0 0 0 19.35 9a1.7 1.7 0 0 0 1.56 1.03H21a2 2 0 1 1 0 4h-.09a1.7 1.7 0 0 0-1.51 1z"/></svg></span><span class="action-text"><span class="action-title">Настройки</span><span class="action-note">Цвет и шрифт</span></span><svg class="chevron" width="16" height="16" viewBox="0 0 24 24"><path d="m9 6 6 6-6 6" stroke="currentColor" stroke-width="2" fill="none"/></svg></button>
      </div>
    </section>
  </main>

  <section class="screen" id="writer">
    <header class="screen-top"><button class="icon-btn" id="writer-back"><svg width="18" height="18" viewBox="0 0 24 24"><path d="m15 6-6 6 6 6" stroke="currentColor" stroke-width="2" fill="none"/></svg></button><h2>Написать</h2></header>
    <div class="screen-body">
      <div class="field"><span class="label">Telegram-юзернейм</span><input class="input" id="target-username" placeholder="например username или @username" autocomplete="off"></div>
      <div class="field"><span class="label">Текст сообщения</span><textarea class="textarea" id="message-text" placeholder="Напиши сообщение..."></textarea></div>
      <button class="primary" id="send-message">Отправить</button>
    </div>
  </section>

  <section class="screen" id="settings">
    <header class="screen-top"><button class="icon-btn" id="settings-back"><svg width="18" height="18" viewBox="0 0 24 24"><path d="m15 6-6 6 6 6" stroke="currentColor" stroke-width="2" fill="none"/></svg></button><h2>Настройки</h2></header>
    <div class="screen-body">
      <div class="field"><span class="label">Цвет оформления</span>
        <div class="swatches">
          <button class="swatch swatch--red" data-accent="red" aria-checked="false"><span class="swatch-dot"></span>Красный</button>
          <button class="swatch swatch--blue" data-accent="blue" aria-checked="true"><span class="swatch-dot"></span>Синий</button>
          <button class="swatch swatch--mint" data-accent="mint" aria-checked="false"><span class="swatch-dot"></span>Мятовый</button>
          <button class="swatch swatch--purple" data-accent="purple" aria-checked="false"><span class="swatch-dot"></span>Фиолетовый</button>
          <button class="swatch swatch--white" data-accent="white" aria-checked="false"><span class="swatch-dot"></span>Белый</button>
        </div>
      </div>
      <div class="field"><span class="label">Шрифт</span>
        <div class="font-options">
          <button class="font-option" data-font="system" aria-checked="true">Системный</button>
          <button class="font-option" data-font="mono" aria-checked="false">Drafting* Mono</button>
          <button class="font-option" data-font="vensca" aria-checked="false">GC Vensca Mono Demo</button>
          <button class="font-option" data-font="anime" aria-checked="false">Anime Ace</button>
        </div>
      </div>
    </div>
  </section>
</div>

<div class="toast" id="toast"></div>

<script>
(function(){
  "use strict";
  var tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
  var root = document.documentElement;
  var greeting = document.getElementById('greeting');
  var envPill = document.getElementById('env-pill');
  var envText = document.getElementById('env-text');
  var toastEl = document.getElementById('toast');
  var writer = document.getElementById('writer');
  var writerBack = document.getElementById('writer-back');
  var targetU = document.getElementById('target-username');
  var msgT = document.getElementById('message-text');
  var sendM = document.getElementById('send-message');
  var settings = document.getElementById('settings');
  var settingsBack = document.getElementById('settings-back');
  var toastTimer = null;

  function toast(m){ toastEl.textContent = m; toastEl.classList.add('show'); clearTimeout(toastTimer); toastTimer = setTimeout(function(){ toastEl.classList.remove('show'); }, 1900); }
  function haptic(){ try { if(tg && tg.HapticFeedback) tg.HapticFeedback.impactOccurred('light'); else if(navigator.vibrate) navigator.vibrate(8); } catch(e){} }
  function hasBack(){ return Boolean(tg && tg.BackButton && tg.isVersionAtLeast && tg.isVersionAtLeast('6.1')); }

  function setAccent(name){
    if(['red','blue','mint','purple','white'].indexOf(name) === -1) name = 'blue';
    root.dataset.accent = name;
    document.querySelectorAll('.swatch').forEach(function(b){ b.setAttribute('aria-checked', String(b.getAttribute('data-accent') === name)); });
    try { localStorage.setItem('sk-accent', name); } catch(e){}
  }
  function setFont(name){
    if(['system','mono','vensca','anime'].indexOf(name) === -1) name = 'system';
    root.dataset.font = name;
    document.querySelectorAll('.font-option').forEach(function(b){ b.setAttribute('aria-checked', String(b.getAttribute('data-font') === name)); });
    try { localStorage.setItem('sk-font', name === 'system' ? '' : name); } catch(e){}
  }

  if(tg){
    try { tg.ready(); tg.expand(); } catch(e){}
    try { if(tg.isVersionAtLeast && tg.isVersionAtLeast('7.7')) tg.disableVerticalSwipes(); } catch(e){}
    if(tg.initDataUnsafe && tg.initDataUnsafe.user){
      var u = tg.initDataUnsafe.user;
      greeting.textContent = u.username ? 'Привет, @' + u.username : 'Привет, ' + (u.first_name || 'друг');
      envPill.classList.add('is-live');
      envText.textContent = 'Telegram';
    }
    if(hasBack()){
      try { tg.BackButton.onClick(function(){ if(writer.classList.contains('is-open')){ writer.classList.remove('is-open'); tg.BackButton.hide(); return; } if(settings.classList.contains('is-open')){ settings.classList.remove('is-open'); tg.BackButton.hide(); return; } }); } catch(e){}
    }
  }

  document.querySelectorAll('.action').forEach(function(b){
    b.addEventListener('click', function(){
      var a = b.getAttribute('data-action');
      if(a === 'settings'){ settings.classList.add('is-open'); if(hasBack()) try{ tg.BackButton.show(); }catch(e){} return; }
      if(a === 'write'){ writer.classList.add('is-open'); if(hasBack()) try{ tg.BackButton.show(); }catch(e){} return; }
      if(a === '1'){ haptic(); toast('«Кнопка 1» — раздел пока не подключён'); }
    });
  });

  writerBack.addEventListener('click', function(){ writer.classList.remove('is-open'); if(hasBack() && !settings.classList.contains('is-open')) try{ tg.BackButton.hide(); }catch(e){} });
  settingsBack.addEventListener('click', function(){ settings.classList.remove('is-open'); if(hasBack() && !writer.classList.contains('is-open')) try{ tg.BackButton.hide(); }catch(e){} });

  document.querySelectorAll('.swatch').forEach(function(b){ b.addEventListener('click', function(){ setAccent(b.getAttribute('data-accent')); haptic(); }); });
  document.querySelectorAll('.font-option').forEach(function(b){ b.addEventListener('click', function(){ setFont(b.getAttribute('data-font')); haptic(); }); });

  sendM.addEventListener('click', function(){
    var username = (targetU.value || '').trim().replace(/^@+/, '');
    var text = (msgT.value || '').trim();
    if(!username){ toast('Укажи Telegram-юзернейм'); targetU.focus(); return; }
    if(!text){ toast('Напиши текст сообщения'); msgT.focus(); return; }
    haptic();
    try {
      if(tg && tg.sendData){
        tg.sendData(JSON.stringify({ type: 'direct_message', username: username, text: text }));
      } else {
        toast('Открой приложение из бота');
      }
    } catch(e){
      toast('Не удалось отправить');
    }
  });

  try {
    var sa = localStorage.getItem('sk-accent'); if(sa) setAccent(sa);
    var sf = localStorage.getItem('sk-font'); if(sf) setFont(sf);
  } catch(e){}
})();
</script>
</body>
</html>
